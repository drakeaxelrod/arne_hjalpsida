<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe4">
  <title>Arnes startsida</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/atkinson-hyperlegible-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <h1 class="greeting" id="greeting">Hej Arne!</h1>
        <p class="date" id="date"></p>
      </div>
      <p class="clock" id="clock" aria-label="Klockan"></p>
    </header>

    <form class="search" action="https://www.google.com/search" method="get" target="grandpa-tab">
      <label class="search-label" for="q">Sök på internet</label>
      <div class="search-row">
        <div class="search-field">
          <span class="search-icon" id="search-icon" aria-hidden="true"></span>
          <input id="q" name="q" type="search" placeholder="Skriv vad du letar efter…" autocomplete="off">
        </div>
        <button class="search-button" type="submit">Sök</button>
      </div>
    </form>

    <!-- Buttons are built from the list in links.js -->
    <ul class="tile-grid" id="tiles"></ul>

    <noscript>
      <p class="notice">Knapparna kunde inte visas. Be någon i familjen om hjälp.</p>
    </noscript>

    <footer class="footer">
      Tryck på en knapp för att öppna sidan. När du är klar stänger du fliken med krysset&nbsp;✕ – då kommer du tillbaka hit.
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="links.js"></script>
  <script src="app.js"></script>
</body>
</html>
